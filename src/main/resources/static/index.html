<!DOCTYPE html>
<html>
<head>
    <title>Beautiful Message on Cloud Run</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
        }

        p {

            line-height: 1.6;
            color: #555;
        }

<body>
<div class="container">
    <h1>Welcome to Cloud Run!</h1>

</div>

</html>
