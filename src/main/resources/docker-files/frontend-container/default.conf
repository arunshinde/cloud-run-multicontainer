server {
	#Port and server details
    listen 8080;
    listen  [::]:8080;
	server_name _;
	
	
    #access and error logs
    access_log  /var/log/nginx/access.log  main;
    
    
    #Reverse Proxy settings
    proxy_busy_buffers_size   512k;
    proxy_buffers   4 512k;
    proxy_buffer_size   256k;
    proxy_read_timeout 180;
    proxy_connect_timeout 180;
    proxy_send_timeout 180;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Content-Type $http_content_type;
    proxy_hide_header X-Powered-By;
	proxy_hide_header Server;
	
	server_tokens off;
    
    
    #Application settings
	underscores_in_headers on;
	client_max_body_size 10m;
    
    location / {
        # Serve the frontend content
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Additional frontend settings if needed
        try_files $uri $uri/ =404;
        
	    
	    #Security settings
	    #more_set_headers "Server: custom";
	    #more_clear_headers "Server";
	    #add_header Server "CUSTOM_SERVER";
	    add_header X-XSS-Protection "1; mode=block";
	    add_header X-Frame-Options "Deny";
	    add_header Set-Cookie "path=/; Domain=$host; HttpOnly; SameSite=strict; Secure";
	    add_header X-Content-Type-Options "nosniff";
	    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
	    add_header Expect-CT 'enforce; max-age=3600';
	   
	    add_header Referrer-Policy "same-origin";
	    add_header Feature-Policy "geolocation 'self'";
	    add_header cross-origin-opener-policy "same-origin-allow-popups";
	    add_header FileETag "None";
	    add_header Cache-Control "max-age=1800";
	    
	    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' data: blob:; frame-src 'self'; child-src 'none'; worker-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'";
    }
    
    #More redirect settings
	location ~ ^/(hello-servlet-1|hello-servlet-2) {
        proxy_pass http://localhost:8081;
    }

	location ~* (<script|<!DOCTYPE|encoding|<xml|\.(sh|py|pl|cgi|php|conf|inc|ini|env|sql|bak|old|swp|map|DS_Store)$) {
    	deny all;
	}
	
    #Replaced
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

